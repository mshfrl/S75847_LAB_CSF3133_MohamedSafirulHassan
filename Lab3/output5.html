<!DOCTYPE html>
<html>
    <body>
        <!--auto update output when input values-->
        <form oninput="z.value=parseInt(x.value)+parseInt(y.value)">
            <!--create a slider, range input for first number-->
            <input id="x" type="range" min="0" max="100" step="1" value="0"> 0 <br> +
            <input id="y" type="number" value="10">
            <br>=
            <output name="z" for="x y"></output>
        </form>
    </body>
</html>
